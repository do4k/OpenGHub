<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230">
  <defs>
    <radialGradient id="body" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#3a3a40"/>
      <stop offset="0.6" stop-color="#2a2a2f"/>
      <stop offset="1" stop-color="#1c1c20"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#26313c"/>
      <stop offset="0.55" stop-color="#141a21"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </radialGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c31"/>
      <stop offset="1" stop-color="#1a1a1e"/>
    </linearGradient>
  </defs>

  <!-- sensor housing -->
  <rect x="76" y="16" width="48" height="22" rx="5" fill="#26262b" stroke="#45454c" stroke-width="1.5"/>

  <!-- lens case (top view) -->
  <rect x="55" y="34" width="90" height="128" rx="16" fill="url(#body)" stroke="#45454c" stroke-width="1.5"/>

  <!-- lens -->
  <circle cx="100" cy="98" r="36" fill="#232328" stroke="#4a4a52" stroke-width="3"/>
  <circle cx="100" cy="98" r="27" fill="url(#lens)" stroke="#2f3740" stroke-width="1.5"/>
  <ellipse cx="92" cy="90" rx="9" ry="6" fill="#46525f" opacity="0.8"/>
  <ellipse cx="109" cy="107" rx="4" ry="3" fill="#22303e"/>

  <!-- status LED -->
  <circle cx="100" cy="27" r="2.5" fill="#c0392b"/>

  <!-- stand -->
  <path d="M52,162 L148,162 L158,194 L42,194 Z" fill="url(#stand)" stroke="#45454c" stroke-width="1.5"/>
  <rect x="80" y="194" width="40" height="14" rx="3" fill="#1c1c20" stroke="#45454c" stroke-width="1.5"/>
</svg>