name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the release job attaches artifacts to a GitHub Release on tags

env:
  RUST_VERSION: "1.99.1"

jobs:
  # ---------------------------------------------------------------------------
  # Build and test the whole workspace (Core + App + PoC probe).
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo clippy --all-targets

  # ---------------------------------------------------------------------------
  # Version string shared by all build jobs: the tag without its leading "v",
  # or a timestamp-based version for untagged (branch/PR) builds.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # For non-tag builds, use date-based version: YY.MM.dd.HHmm.
            # Leading zeros are stripped so the numeric segments stay valid
            # for the .deb package version.
            adate=$(date -u +'%y.%m.%d.%H%M' | sed -E 's/\b0+([0-9])/\1/g')
            echo "version=0.0.0-${adate}" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Linux: the release binary (the same output `make publish` produces
  # locally) plus a .deb (built with nfpm).
  # ---------------------------------------------------------------------------
  build-linux:
    needs: [test, version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - name: Build release binary
        run: |
          cargo build --release -p openghub-app
          mkdir -p bin
          cp target/release/openghub-app bin/openghub
      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf "dist/openghub_${VERSION}_linux_amd64.tar.gz" -C bin openghub
      - name: Build .deb
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          "$(go env GOPATH)/bin/nfpm" pkg -p deb -f packaging/nfpm.yaml \
            -t "dist/openghub_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: openghub-linux
          path: dist/*

  # ---------------------------------------------------------------------------
  # Windows: the release GUI .exe, zipped up.
  # ---------------------------------------------------------------------------
  build-windows:
    needs: [test, version]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build release binary
        run: cargo build --release -p openghub-app
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/openghub-app.exe dist/openghub.exe
          Compress-Archive -Path dist/openghub.exe -DestinationPath "dist/openghub_${env:VERSION}_windows_amd64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: openghub-windows
          path: dist/*.zip

  # ---------------------------------------------------------------------------
  # macOS: a .app bundle (Info.plist + generated .icns) around the release
  # binary, zipped with ditto. Unsigned — see the README note about
  # Gatekeeper on first launch.
  # ---------------------------------------------------------------------------
  build-macos:
    needs: [test, version]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Build release binary
        run: cargo build --release -p openghub-app
      - name: Assemble .app bundle
        run: |
          APP="OpenGHub.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/openghub-app "$APP/Contents/MacOS/openghub"
          sed "s/__VERSION__/${VERSION}/g" packaging/macos/Info.plist.template > "$APP/Contents/Info.plist"

          # Build an .icns from the 512px Icon.png (sizes up to 512).
          mkdir AppIcon.iconset
          for pair in "16 16x16" "32 16x16@2x" "32 32x32" "64 32x32@2x" \
                      "128 128x128" "256 128x128@2x" "256 256x256" "512 256x256@2x" "512 512x512"; do
            set -- $pair
            sips -z "$1" "$1" Icon.png --out "AppIcon.iconset/icon_$2.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
      - name: Package zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent OpenGHub.app "dist/openghub_${VERSION}_macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: openghub-macos
          path: dist/*.zip

  # ---------------------------------------------------------------------------
  # On a version tag or manual trigger, gather every platform's artifacts into
  # one GitHub Release. Manual trigger creates a prerelease with a nightly tag.
  # ---------------------------------------------------------------------------
  release:
    needs: [build-linux, build-windows, build-macos, version]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('nightly-{0}', needs.version.outputs.version) }}
