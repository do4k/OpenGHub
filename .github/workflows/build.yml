name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the release job attaches artifacts to a GitHub Release on tags

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  # ---------------------------------------------------------------------------
  # Build the whole solution (Core + App + PoC probe).
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet build LogiTux.slnx

  # ---------------------------------------------------------------------------
  # Version string shared by all build jobs: the tag without its leading "v",
  # or a timestamp-based version for untagged (branch/PR) builds.
  # ---------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # For non-tag builds, use date-based version: YY.MM.dd-HHmm
            echo "version=0.0.0-$(date -u +'%y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Linux: the trimmed single-file binary (the same output `make publish`
  # produces locally) plus a .deb (built with nfpm).
  # ---------------------------------------------------------------------------
  build-linux:
    needs: [test, version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish single-file binary
        run: |
          dotnet publish src/LogiTux.App -p:PublishProfile=linux-x64 -o bin
          mv bin/LogiTux.App bin/logitux
      - name: Package tarball
        run: |
          mkdir -p dist
          tar -czf "dist/logitux_${VERSION}_linux_amd64.tar.gz" -C bin logitux
      - name: Build .deb
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          "$(go env GOPATH)/bin/nfpm" pkg -p deb -f packaging/nfpm.yaml \
            -t "dist/logitux_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: logitux-linux
          path: dist/*

  # ---------------------------------------------------------------------------
  # Windows: a self-contained single-file GUI .exe, zipped up.
  # ---------------------------------------------------------------------------
  build-windows:
    needs: [test, version]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/LogiTux.App -c Release -r win-x64 \
            -p:PublishSingleFile=true -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=true -p:TrimMode=partial -o dist
          mv dist/LogiTux.App.exe dist/logitux.exe
      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist/logitux.exe -DestinationPath "dist/logitux_${env:VERSION}_windows_amd64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: logitux-windows
          path: dist/*.zip

  # ---------------------------------------------------------------------------
  # macOS: a .app bundle (Info.plist + generated .icns) around the published
  # arm64 binary, zipped with ditto. Unsigned — see the README note about
  # Gatekeeper on first launch.
  # ---------------------------------------------------------------------------
  build-macos:
    needs: [test, version]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish
        run: |
          dotnet publish src/LogiTux.App -c Release -r osx-arm64 \
            -p:PublishSingleFile=true -p:SelfContained=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=true -p:TrimMode=partial -o bundle
          mv bundle/LogiTux.App logitux
      - name: Assemble .app bundle
        run: |
          APP="LogiTux.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp logitux "$APP/Contents/MacOS/logitux"
          sed "s/__VERSION__/${VERSION}/g" packaging/macos/Info.plist.template > "$APP/Contents/Info.plist"

          # Build an .icns from the 512px Icon.png (sizes up to 512).
          mkdir AppIcon.iconset
          for pair in "16 16x16" "32 16x16@2x" "32 32x32" "64 32x32@2x" \
                      "128 128x128" "256 128x128@2x" "256 256x256" "512 256x256@2x" "512 512x512"; do
            set -- $pair
            sips -z "$1" "$1" Icon.png --out "AppIcon.iconset/icon_$2.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
      - name: Package zip
        run: |
          mkdir -p dist
          ditto -c -k --keepParent LogiTux.app "dist/logitux_${VERSION}_macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: logitux-macos
          path: dist/*.zip

  # ---------------------------------------------------------------------------
  # On a version tag or manual trigger, gather every platform's artifacts into
  # one GitHub Release. Manual trigger creates a prerelease with a nightly tag.
  # ---------------------------------------------------------------------------
  release:
    needs: [build-linux, build-windows, build-macos, version]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('nightly-{0}', needs.version.outputs.version) }}