[package]
name = "openghub-core"
version = "0.1.0"
edition = "2024"

# The hardware layer talks to devices over hidraw/V4L2 with raw POSIX
# syscalls, so it's Unix-only. `config` (and the shared error type) build
# everywhere; Windows/macOS builds compile but ship no device support.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["fs", "poll"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
